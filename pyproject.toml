[project]
name = "trajecteval"
version = "0.1.0"
description = "Grade AI agent trajectories on four dimensions: final state, bounds, critical mistakes, and LLM-judged path quality"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[build-system]
requires = ["uv_build>=0.9"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
# Live tests call a real LLM API: deselected by default so the normal suite
# never touches the network or spends money. Run them with `uv run pytest -m live`.
addopts = "-m 'not live'"
markers = [
    "live: calls a real LLM API (needs TRAJECTEVAL_JUDGE_API_KEY); deselected by default",
]

